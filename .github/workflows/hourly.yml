# Runs HIVE-WORKSPACE's Buzz scheduler every hour (reminders, weekly digests, repeating tasks).
# Needs two repository secrets: APP_URL (e.g. https://hive-workspace.com) and CRON_SECRET (same value as on Vercel).
name: Buzz hourly
on:
  schedule:
    - cron: "5 * * * *" # minute 5 of every hour; GitHub may run it a few minutes late
  workflow_dispatch: {} # "Run workflow" button for testing
permissions: {}
jobs:
  buzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the scheduler
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/hourly"
